# Quality checks on every push, then the web app's Docker image. The mobile
# app is checked (formatting, types) but not built.
# Tip: pin third-party actions to a full commit SHA (Renovate/Dependabot keep them up to date).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aura-seeker-web
  # The API the published web app calls, compiled into it. That API must allow
  # the web app's origin (CORS). Override with a repository variable.
  API_URL: ${{ vars.API_URL || 'https://api.aura-seeker.matheo-galuba.com' }}
  # No interactive terminal UI and no telemetry from turbo in CI.
  TURBO_UI: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # 1. Fast static checks on the whole monorepo: format, lint, types
  quality:
    # A branch of this repository already runs on push: the pull_request
    # event is only needed for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  # 2. Web image: build, smoke test, scan; push + sign only on the default branch and tags
  web-image:
    needs: [quality]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (local, for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_URL=${{ env.API_URL }}
          load: true
          tags: ci-local:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Smoke test (serves the app, client-side routes and hashed assets)
        run: |
          docker run -d --name web -p 8080:8080 ci-local:test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            [ "$i" = 30 ] && { docker logs web; exit 1; }
            sleep 1
          done
          set -x
          # The API address is compiled into the app.
          docker exec web sh -c 'grep -rqF "$1" /usr/share/nginx/html/assets' sh "$API_URL"
          # The page, and the same page for a client-side route.
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS 'http://localhost:8080/map?q=test' | grep -q '<div id="root">'
          # A hashed asset is served with a long cache lifetime.
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl -fsSI "http://localhost:8080$asset" | grep -qi 'cache-control: .*immutable'
          # Not root.
          [ "$(docker exec web id -u)" != 0 ]

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-local:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (reuses the cache, adds SBOM + provenance)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_URL=${{ env.API_URL }}
          push: true
          platforms: linux/amd64        # add linux/arm64 if needed
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          sbom: true
          provenance: mode=max

      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image (keyless, OIDC)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
